name: bmkg-indonesia
version: 1.0.3
description: MCP Server for BMKG Indonesia - Weather, Earthquake, and Region Data via Streamable HTTP

startCommand:
  type: http
  configSchema:
    type: object
    properties: {}
  commandFunction: |
    (config) => ({
      url: "https://mcp-bmkg.dhanypedia.com/mcp"
    })

buildCommand: pip install -e .

categories:
  - weather
  - location
  - government
  - education

homepage: https://bmkg-api.dhanypedia.com
repository:
  type: git
  url: https://github.com/dhanyyudi/bmkg-api
